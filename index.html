<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魔法の読み取りスキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #fdfbf7; color: #333; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #008080; font-size: 1.5rem; }
    #camera-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; border: 2px solid #ffcc80; border-radius: 10px; overflow: hidden; }
    video, canvas { display: block; width: 100%; touch-action: none; }
    #overlay-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    .btn { padding: 12px 24px; margin: 15px 5px; background: #008080; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    #result-box { width: 90%; max-width: 600px; height: 100px; margin: 10px auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    #status { color: #d32f2f; font-weight: bold; margin: 10px 0; min-height: 24px;}
    
    /* 今回追加：AIが見ている画像をプレビューするエリア */
    #preview-container { margin-top: 15px; border-top: 2px dashed #ccc; padding-top: 10px; }
    #preview-img { max-width: 100%; max-height: 150px; border: 1px solid #008080; }
  </style>
</head>
<body>

  <h1>📷 魔法の読み取りスキャナー</h1>
  <button class="btn" onclick="startCamera()">カメラを起動</button>
  <button class="btn" onclick="processOCR()">読み取ってコピー</button>
  
  <p id="status">ここに現在の状況が出ます</p>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <textarea id="result-box" placeholder="ここに読み取った文字が入るよ..."></textarea>

  <div id="preview-container">
    <p style="font-size: 0.9rem; color: #666;">↓ AIは今、この画像を読んでいます ↓</p>
    <img id="preview-img" alt="プレビュー画像がここに出ます" />
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const previewImg = document.getElementById('preview-img');

    let startX = 0, startY = 0, rectWidth = 0, rectHeight = 0;
    let isDrawing = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.clientWidth;
          canvas.height = video.clientHeight;
        };
        statusText.innerText = "カメラ準備OK！画面をなぞってね。";
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startX = getTouchPos(e).x; startY = getTouchPos(e).y; isDrawing = true; });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); if (!isDrawing) return;
      const pos = getTouchPos(e); rectWidth = pos.x - startX; rectHeight = pos.y - startY;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, rectWidth, rectHeight);
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    async function processOCR() {
      if (Math.abs(rectWidth) < 10 || Math.abs(rectHeight) < 10) {
        statusText.innerText = "エラー: もう少し大きく四角を囲んでね！";
        return;
      }

      statusText.innerText = "画像を切り取り中...";

      const cropCanvas = document.createElement('canvas');
      const scaleX = video.videoWidth / canvas.width;
      const scaleY = video.videoHeight / canvas.height;

      const srcX = Math.min(startX, startX + rectWidth) * scaleX;
      const srcY = Math.min(startY, startY + rectHeight) * scaleY;
      const srcW = Math.abs(rectWidth) * scaleX;
      const srcH = Math.abs(rectHeight) * scaleY;

      cropCanvas.width = srcW;
      cropCanvas.height = srcH;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

      // AIに渡す画像をプレビューに表示する
      const imageData = cropCanvas.toDataURL('image/png');
      previewImg.src = imageData;

      try {
        // AI職人の進捗を画面に表示する設定を追加
        const result = await Tesseract.recognize(imageData, 'jpn', {
          logger: m => {
            console.log(m);
            if (m.status === 'recognizing text') {
              statusText.innerText = `文字を解読中... ${Math.round(m.progress * 100)}%`;
            } else {
              statusText.innerText = `AIの準備中... (${m.status} ${Math.round(m.progress * 100)}%)`;
            }
          }
        });

        const text = result.data.text.trim();
        resultBox.value = text;
        
        if (text === "") {
            statusText.innerText = "読み取り完了！でも文字が見つかりませんでした。";
        } else {
            await navigator.clipboard.writeText(text);
            statusText.innerText = "読み取り成功！コピーしました✨";
        }
      } catch (err) {
        // 本当のエラー原因を画面に表示する
        statusText.innerText = "エラー詳細: " + (err.message || "原因不明のエラー");
        console.error(err);
      }
    }
  </script>
</body>
</html>
