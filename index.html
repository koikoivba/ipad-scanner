<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魔法の読み取りスキャナー（Gemini 3 Flash版）</title>
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #fdfbf7; color: #333; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #673ab7; font-size: 1.5rem; margin-bottom: 5px; } 
    #camera-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; border: 2px solid #ce93d8; border-radius: 10px; overflow: hidden; background: #000; }
    video, canvas { display: block; width: 100%; touch-action: none; }
    #overlay-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    .btn { padding: 12px 20px; margin: 5px; background: #673ab7; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-copy { background: #ff9800; }
    #result-box { width: 90%; max-width: 600px; height: 100px; margin: 10px auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; }
    #status { color: #d32f2f; font-weight: bold; margin: 10px 0; min-height: 24px;}
    
    .api-settings { background: #f3e5f5; padding: 15px; border-radius: 8px; max-width: 600px; margin: 10px auto; text-align: center; }
    .api-settings input { width: 90%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; text-align: center;}
  </style>
</head>
<body>

  <h1>✨ 魔法の読み取りスキャナー</h1>
  
  <div class="api-settings">
    <label style="font-size: 0.9rem; font-weight: bold; display:block; margin-bottom:8px;">🔑 Gemini APIキー (画面を閉じると消去されます)</label>
    <input type="password" id="api-key" placeholder="使う時だけここに入力してね (AI-zaSy...)">
  </div>

  <div>
    <button class="btn" onclick="startCamera()">① カメラ起動</button>
    <button class="btn" onclick="processWithGemini()">② 囲んで読み取る</button>
  </div>
  
  <p id="status">ここに状況が出ます</p>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <textarea id="result-box" placeholder="ここに読み取った文字が綺麗に入ります..."></textarea>
  <button class="btn btn-copy" onclick="copyResultText()">③ コピーする</button>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const apiKeyInput = document.getElementById('api-key');

    let startX = 0, startY = 0, rectWidth = 0, rectHeight = 0;
    let isDrawing = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } }, audio: false 
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { canvas.width = video.clientWidth; canvas.height = video.clientHeight; };
        statusText.innerText = "カメラ準備OK！なぞってね。";
      } catch (err) { statusText.innerText = "カメラエラー: " + err.message; }
    }

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect(); const touch = e.touches[0];
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startX = getTouchPos(e).x; startY = getTouchPos(e).y; isDrawing = true; });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); if (!isDrawing) return;
      const pos = getTouchPos(e); rectWidth = pos.x - startX; rectHeight = pos.y - startY;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, rectWidth, rectHeight);
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    async function processWithGemini() {
      // 余計な空白が入っていても自動で削除する（.trim()）
      const apiKey = apiKeyInput.value.trim();
      
      if (!apiKey) return statusText.innerText = "エラー: 上の欄にAPIキーを入力してね！";
      if (Math.abs(rectWidth) < 20 || Math.abs(rectHeight) < 20) return statusText.innerText = "エラー: もう少し大きく四角を囲んでね！";

      statusText.innerText = "画像を切り取り中...";
      resultBox.value = "";

      const cropCanvas = document.createElement('canvas');
      const scaleX = video.videoWidth / canvas.width;
      const scaleY = video.videoHeight / canvas.height;
      const srcX = Math.round(Math.min(startX, startX + rectWidth) * scaleX);
      const srcY = Math.round(Math.min(startY, startY + rectHeight) * scaleY);
      const srcW = Math.round(Math.abs(rectWidth) * scaleX);
      const srcH = Math.round(Math.abs(rectHeight) * scaleY);

      cropCanvas.width = srcW;
      cropCanvas.height = srcH;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

      const base64Image = cropCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      statusText.innerText = "Gemini 3 Flashが解読中...🤖✨ (爆速です!)";

      try {
        // 【ここが重要！】URLの宛先を gemini-3-flash に変更しました
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "この画像内に書かれているテキストを正確に文字起こししてください。箇条書きなどはそのまま反映し、テキストのみを出力してください。誤字脱字がある場合は、文脈から正しい日本語に補正してください。" },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) {
           throw new Error(`APIキー間違い、または未有効化です (${response.status})`);
        }

        const data = await response.json();
        const cleanText = data.candidates[0].content.parts[0].text.trim();
        
        resultBox.value = cleanText;
        statusText.innerText = "大成功！Gemini 3 Flashが完璧に読み取りました✨";

      } catch (err) {
        statusText.innerText = "通信エラー: " + err.message;
        console.error("Gemini Error:", err);
      }
    }

    async function copyResultText() {
      const text = resultBox.value;
      if (!text) return statusText.innerText = "コピーする文字がありません！";
      try {
        await navigator.clipboard.writeText(text);
        statusText.innerText = "✅ コピー大成功！別のアプリに貼り付けてね。";
      } catch (err) { statusText.innerText = "コピー失敗。手動でコピーしてね。"; }
    }
  </script>
</body>
</html>
