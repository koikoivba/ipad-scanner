<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魔法の読み取りスキャナー（高精度・超安定版）</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #fdfbf7; color: #333; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #008080; font-size: 1.5rem; margin-bottom: 5px; }
    #camera-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; border: 2px solid #ffcc80; border-radius: 10px; overflow: hidden; background: #000; }
    video, canvas { display: block; width: 100%; touch-action: none; }
    #overlay-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    .btn { padding: 12px 20px; margin: 5px; background: #008080; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-copy { background: #ff9800; }
    #result-box { width: 90%; max-width: 600px; height: 100px; margin: 10px auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; }
    #status { color: #d32f2f; font-weight: bold; margin: 10px 0; min-height: 24px;}
    #preview-container { margin-top: 15px; border-top: 2px dashed #ccc; padding-top: 10px; }
    #preview-img { max-width: 100%; max-height: 150px; border: 1px solid #008080; background: #eee; }
  </style>
</head>
<body>

  <h1>📷 魔法の読み取りスキャナー</h1>
  
  <div>
    <button class="btn" onclick="startCamera()">① カメラ起動（高画質）</button>
    <button class="btn" onclick="processOCR()">② 読み取る</button>
  </div>
  
  <p id="status">ここに状況が出ます</p>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <textarea id="result-box" placeholder="ここに読み取った文字が入るよ..."></textarea>
  <button class="btn btn-copy" onclick="copyResultText()">③ コピーする</button>

  <div id="preview-container">
    <p style="font-size: 0.9rem; color: #666;">↓ AIが読んでいる画像（大津の二値化済） ↓</p>
    <img id="preview-img" alt="プレビュー画像" />
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const previewImg = document.getElementById('preview-img');

    let startX = 0, startY = 0, rectWidth = 0, rectHeight = 0;
    let isDrawing = false;

    async function startCamera() {
      try {
        const constraints = {
          video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.clientWidth;
          canvas.height = video.clientHeight;
        };
        statusText.innerText = "カメラ準備OK！なぞってね。";
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect(); const touch = e.touches[0];
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }
    
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startX = getTouchPos(e).x; startY = getTouchPos(e).y; isDrawing = true; });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); if (!isDrawing) return;
      const pos = getTouchPos(e); rectWidth = pos.x - startX; rectHeight = pos.y - startY;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, rectWidth, rectHeight);
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    // 大成功した魔法の関数：大津の二値化
    function applyOtsuBinarization(imageData) {
      const data = imageData.data;
      const length = data.length;
      let grays = new Uint8Array(length / 4);

      for (let i = 0; i < length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        grays[i / 4] = Math.round(r * 0.2126 + g * 0.7152 + b * 0.0722);
      }

      let histogram = new Array(256).fill(0);
      for (let i = 0; i < grays.length; i++) histogram[grays[i]]++;

      let total = grays.length, sum = 0, sumB = 0, wB = 0, wF = 0;
      let varMax = 0, threshold = 0;
      for (let i = 0; i < 256; i++) sum += i * histogram[i];

      for (let i = 0; i < 256; i++) {
        wB += histogram[i]; if (wB === 0) continue;
        wF = total - wB; if (wF === 0) break;
        sumB += i * histogram[i];
        let mB = sumB / wB; let mF = (sum - sumB) / wF;
        let varBetween = wB * wF * Math.pow(mB - mF, 2);
        if (varBetween > varMax) { varMax = varBetween; threshold = i; }
      }

      for (let i = 0; i < length; i += 4) {
        const color = grays[i / 4] < threshold ? 0 : 255;
        data[i] = color; data[i + 1] = color; data[i + 2] = color; data[i + 3] = 255;
      }
      return imageData;
    }

    async function processOCR() {
      if (Math.abs(rectWidth) < 20 || Math.abs(rectHeight) < 20) {
        return statusText.innerText = "エラー: もう少し大きく四角を囲んでね！";
      }

      statusText.innerText = "画像を最適化中...";
      resultBox.value = "";

      const cropCanvas = document.createElement('canvas');
      const scaleX = video.videoWidth / canvas.width;
      const scaleY = video.videoHeight / canvas.height;
      
      // 【改善1】Safari対策：座標とサイズをすべて「整数」に丸める（Math.round）
      const srcX = Math.round(Math.min(startX, startX + rectWidth) * scaleX);
      const srcY = Math.round(Math.min(startY, startY + rectHeight) * scaleY);
      const srcW = Math.round(Math.abs(rectWidth) * scaleX);
      const srcH = Math.round(Math.abs(rectHeight) * scaleY);

      cropCanvas.width = srcW;
      cropCanvas.height = srcH;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

      let imageDataObj = cropCtx.getImageData(0, 0, srcW, srcH);
      imageDataObj = applyOtsuBinarization(imageDataObj);
      cropCtx.putImageData(imageDataObj, 0, 0);

      const finalImageData = cropCanvas.toDataURL('image/png');
      previewImg.src = finalImageData;

      let worker = null;
      try {
        statusText.innerText = "高精度AIを準備中... (1/3)";
        
        // 【改善2】一番丁寧で安定した職人の呼び出し方
        worker = await Tesseract.createWorker({
          logger: m => {
            if (m.status === 'recognizing text') {
              statusText.innerText = `文字を解読中... ${Math.round(m.progress * 100)}%`;
            } else if (m.status === 'loading tesseract core') {
              statusText.innerText = "AIのエンジンを起動中...";
            }
          }
        });

        statusText.innerText = "辞書を読み込み中... (2/3)";
        await worker.loadLanguage('jpn+eng');
        await worker.initialize('jpn+eng');

        statusText.innerText = "AIの視力を調整中... (3/3)";
        // 【改善3】undefinedにならないよう、魔法の呪文を直接「'6'」と書く
        await worker.setParameters({
          tessedit_pageseg_mode: '6',
        });

        statusText.innerText = "解読スタート！";
        const result = await worker.recognize(finalImageData);
        
        // 読んだ文字から余計な空白を消す
        const text = result.data.text.replace(/\s+/g, '').trim();
        resultBox.value = text;
        
        statusText.innerText = text ? "読み取り大成功！コピーしてね✨" : "文字が見つかりませんでした。";

      } catch (err) {
        // 【改善4】万が一エラーが出ても、確実に画面に文字を出す仕組み
        const errorMsg = err.message || JSON.stringify(err) || String(err);
        statusText.innerText = "エラー: " + errorMsg;
        console.error("OCR Error:", err);
      } finally {
        if (worker) {
          await worker.terminate(); // iPadが熱くならないようにお片付け
        }
      }
    }

    async function copyResultText() {
      const text = resultBox.value;
      if (!text) return statusText.innerText = "コピーする文字がありません！";
      try {
        await navigator.clipboard.writeText(text);
        statusText.innerText = "✅ コピー大成功！";
      } catch (err) { statusText.innerText = "コピー失敗。手動でコピーしてね。"; }
    }
  </script>
</body>
</html>
