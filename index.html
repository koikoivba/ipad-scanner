<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魔法の全自動スキャナー</title>
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #fdfbf7; color: #333; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #673ab7; font-size: 1.5rem; margin-bottom: 5px; } 
    
    .api-settings { background: #f3e5f5; padding: 10px; border-radius: 8px; max-width: 600px; margin: 0 auto 10px; text-align: center; }
    .api-settings input { width: 90%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; text-align: center;}
    
    /* 【改善】結果エリアを上に持ってきたので、目立たせます */
    #result-area { max-width: 600px; margin: 0 auto 10px; padding: 10px; background: #fff; border: 2px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    #result-box { width: 95%; height: 80px; margin-bottom: 5px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1.1rem; }
    
    .btn-copy { padding: 10px 20px; background: #ff9800; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; }
    #status { color: #d32f2f; font-weight: bold; margin: 5px 0; min-height: 24px;}
    
    /* カメラエリアは下へ */
    #camera-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; border: 2px solid #ce93d8; border-radius: 10px; overflow: hidden; background: #000; }
    video, canvas { display: block; width: 100%; touch-action: none; }
    #overlay-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
  </style>
</head>
<body>

  <h1>✨ 魔法の全自動スキャナー</h1>
  
  <div class="api-settings">
    <label style="font-size: 0.8rem; font-weight: bold; display:block; margin-bottom:5px;">🔑 Gemini APIキー (使う時だけ入力)</label>
    <input type="password" id="api-key" placeholder="AI-zaSy...">
  </div>

  <div id="result-area">
    <p id="status">カメラを準備しています...</p>
    <textarea id="result-box" placeholder="なぞるとここに文字が出ます..."></textarea><br>
    <button class="btn-copy" onclick="copyResultText()">手動でコピーする</button>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const apiKeyInput = document.getElementById('api-key');

    let startX = 0, startY = 0, rectWidth = 0, rectHeight = 0;
    let isDrawing = false;

    // 【改善①】画面が開かれた瞬間に、自動でカメラを起動する
    window.onload = () => {
      startCamera();
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } }, audio: false 
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { canvas.width = video.clientWidth; canvas.height = video.clientHeight; };
        statusText.innerText = "準備OK！APIキーを入れて、なぞってね。";
      } catch (err) { statusText.innerText = "カメラエラー: " + err.message; }
    }

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect(); const touch = e.touches[0];
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startX = getTouchPos(e).x; startY = getTouchPos(e).y; isDrawing = true; });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); if (!isDrawing) return;
      const pos = getTouchPos(e); rectWidth = pos.x - startX; rectHeight = pos.y - startY;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, rectWidth, rectHeight);
    });
    
    // 【改善②】指を離した瞬間に、自動で読み取り（AI通信）を開始する
    canvas.addEventListener('touchend', () => { 
      isDrawing = false; 
      processWithGemini(); // 自動発動！
    });

    async function processWithGemini() {
      const apiKey = apiKeyInput.value.trim();
      
      if (!apiKey) return statusText.innerText = "エラー: 先に上の欄にAPIキーを入力してね！";
      if (Math.abs(rectWidth) < 20 || Math.abs(rectHeight) < 20) return statusText.innerText = "もう少し大きく四角を囲んでね！";

      statusText.innerText = "Geminiが解読中...🤖✨ (数秒待ってね)";
      resultBox.value = "";

      const cropCanvas = document.createElement('canvas');
      const scaleX = video.videoWidth / canvas.width;
      const scaleY = video.videoHeight / canvas.height;
      const srcX = Math.round(Math.min(startX, startX + rectWidth) * scaleX);
      const srcY = Math.round(Math.min(startY, startY + rectHeight) * scaleY);
      const srcW = Math.round(Math.abs(rectWidth) * scaleX);
      const srcH = Math.round(Math.abs(rectHeight) * scaleY);

      cropCanvas.width = srcW;
      cropCanvas.height = srcH;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

      const base64Image = cropCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "この画像内に書かれているテキストを正確に文字起こししてください。箇条書きなどはそのまま反映し、テキストのみを出力してください。誤字脱字がある場合は、文脈から正しい日本語に補正してください。" },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) {
           const errorData = await response.json();
           const errorDetails = errorData.error ? errorData.error.message : response.statusText;
           throw new Error(`エラー番号 ${response.status} : ${errorDetails}`);
        }

        const data = await response.json();
        const cleanText = data.candidates[0].content.parts[0].text.trim();
        
        resultBox.value = cleanText;

        // 【改善③】読み取り完了後、自動でクリップボードへのコピーに挑戦する
        try {
          await navigator.clipboard.writeText(cleanText);
          statusText.innerText = "大成功！自動コピー完了✨ すぐに貼り付けできます。";
        } catch (copyErr) {
          // Safariのセキュリティで弾かれた場合は、優しいメッセージに変更
          statusText.innerText = "読み取り成功！すぐ下のオレンジのボタンを押してコピーしてね。";
        }

      } catch (err) {
        statusText.innerText = "通信エラー: " + err.message;
        console.error("Gemini Error:", err);
      }
    }

    async function copyResultText() {
      const text = resultBox.value;
      if (!text) return statusText.innerText = "コピーする文字がありません！";
      try {
        await navigator.clipboard.writeText(text);
        statusText.innerText = "✅ コピー大成功！別のアプリに貼り付けてね。";
      } catch (err) { statusText.innerText = "コピー失敗。手動で選択してコピーしてね。"; }
    }
  </script>
</body>
</html>
